<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="collection-dialog-title">
  <button type="button" class="sheet__backdrop" (click)="close()" aria-label="Cerrar"></button>

  <div class="board">
    <div class="board__glow" aria-hidden="true"></div>

    <header class="board__head">
      <div>
        <p class="eyebrow">Archivo del método</p>
        <h2 id="collection-dialog-title">
          {{ isEdit ? 'Editar colección' : 'Nueva colección' }}
        </h2>
      </div>
      <button type="button" class="board__close" (click)="close()" aria-label="Cerrar">×</button>
    </header>

    <div class="board__body">
      <label class="field">
        <span>Nombre</span>
        <input
          type="text"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          placeholder="Hábitos, Nutrición, Mindset…"
        />
      </label>

      <div class="field">
        <span>Icono</span>
        <div class="icon-grid" role="group" aria-label="Icono">
          @for (item of icons; track item.key) {
            <button
              type="button"
              class="icon-btn"
              [class.is-on]="icon() === item.key"
              (click)="icon.set(item.key)"
              [attr.title]="item.label">
              {{ item.glyph }}
            </button>
          }
        </div>
      </div>

      <div class="field">
        <span>Tono</span>
        <div class="tone-row" role="group" aria-label="Tono">
          @for (item of tones; track item.key) {
            <button
              type="button"
              class="tone-btn"
              [class.is-on]="tone() === item.key"
              [attr.data-tone]="item.key"
              (click)="tone.set(item.key)">
              {{ item.label }}
            </button>
          }
        </div>
      </div>
    </div>

    @if (saveError()) {
      <p class="board__error">{{ saveError() }}</p>
    }

    <footer class="board__foot">
      @if (isEdit) {
        <button
          type="button"
          class="danger-btn"
          (click)="remove()"
          [disabled]="saving() || deleting()">
          {{ deleting() ? 'Eliminando…' : 'Eliminar colección' }}
        </button>
      }
      <div class="board__foot-right">
        <button type="button" class="ghost-btn" (click)="close()" [disabled]="saving() || deleting()">
          Cancelar
        </button>
        <button type="button" class="save-btn" (click)="save()" [disabled]="saving() || deleting()">
          {{ saving() ? 'Guardando…' : isEdit ? 'Guardar' : 'Crear colección' }}
        </button>
      </div>
    </footer>
  </div>
</div>
