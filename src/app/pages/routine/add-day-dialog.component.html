<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="add-day-dialog-title">
  <button type="button" class="sheet__backdrop" (click)="close()" aria-label="Cerrar"></button>

  <div class="board">
    <div class="board__glow" aria-hidden="true"></div>

    <header class="board__head">
      <div>
        <p class="eyebrow">Nuevo día</p>
        <h2 id="add-day-dialog-title">¿Cómo lo montamos?</h2>
      </div>
      <button type="button" class="board__close" (click)="close()" aria-label="Cerrar">×</button>
    </header>

    <div class="board__body">
      <button type="button" class="blank" (click)="startBlank()">
        <span class="blank__mark" aria-hidden="true">+</span>
        <span>
          <strong>Empezar en blanco</strong>
          <em>Un día vacío para armarlo a mano</em>
        </span>
      </button>

      <div class="templates">
        <div class="templates__head">
          <p>Cargar plantilla</p>
          <label class="search">
            <span aria-hidden="true">⌕</span>
            <input
              type="search"
              placeholder="Buscar plantilla…"
              [ngModel]="query()"
              (ngModelChange)="query.set($event)"
            />
          </label>
        </div>

        <div class="templates__list">
          @for (item of filtered(); track item._id) {
            <button type="button" class="tpl" (click)="pick(item)">
              <span class="tpl__copy">
                <strong>{{ item.day || 'Sin nombre' }}</strong>
                <em>{{ item.focus || 'Sin foco' }} · {{ item.duration || '—' }}</em>
              </span>
              <span class="tpl__count">
                {{ item.exercises.length }}
                <small>ej.</small>
              </span>
            </button>
          } @empty {
            <p class="templates__empty">
              {{ templates().length === 0
                ? 'Aún no hay plantillas en el archivo de rutinas.'
                : 'Ninguna plantilla encaja con esa búsqueda.' }}
            </p>
          }
        </div>
      </div>
    </div>
  </div>
</div>
