<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="category-dialog-title">
  <button type="button" class="sheet__backdrop" (click)="close()" aria-label="Cerrar"></button>

  <div class="board">
    <div class="board__glow" aria-hidden="true"></div>

    <header class="board__head">
      <div>
        <p class="eyebrow">Catálogo de movimiento</p>
        <h2 id="category-dialog-title">
          {{ isEdit ? 'Editar categoría' : 'Nueva categoría' }}
        </h2>
      </div>
      <button type="button" class="board__close" (click)="close()" aria-label="Cerrar">×</button>
    </header>

    <div class="board__body">
      <label class="field">
        <span>Nombre</span>
        <input
          type="text"
          [ngModel]="label()"
          (ngModelChange)="label.set($event)"
          placeholder="Pecho, Gomas, Peso corporal…"
        />
      </label>
    </div>

    @if (saveError()) {
      <p class="board__error">{{ saveError() }}</p>
    }

    <footer class="board__foot">
      @if (isEdit) {
        <button
          type="button"
          class="danger-btn"
          (click)="remove()"
          [disabled]="saving() || deleting()">
          {{ deleting() ? 'Eliminando…' : 'Eliminar' }}
        </button>
      }
      <div class="board__foot-right">
        <button
          type="button"
          class="ghost-btn"
          (click)="close()"
          [disabled]="saving() || deleting()">
          Cancelar
        </button>
        <button
          type="button"
          class="save-btn"
          (click)="save()"
          [disabled]="saving() || deleting()">
          {{ saving() ? 'Guardando…' : isEdit ? 'Guardar cambios' : 'Crear categoría' }}
        </button>
      </div>
    </footer>
  </div>
</div>
