<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="review-dialog-title">
  <button type="button" class="sheet__backdrop" (click)="close()" aria-label="Cerrar"></button>

  <div class="board">
    <div class="board__glow" aria-hidden="true"></div>

    <header class="board__head">
      <div>
        <p class="eyebrow">Calendario de control</p>
        <h2 id="review-dialog-title">
          {{ isEdit ? 'Editar revisión' : 'Programar revisión' }}
        </h2>
      </div>
      <button type="button" class="board__close" (click)="close()" aria-label="Cerrar">×</button>
    </header>

    <div class="board__body">
      <label class="field">
        <span>Cliente</span>
        <select
          [ngModel]="clientId()"
          (ngModelChange)="clientId.set($event)"
          [disabled]="isEdit">
          @for (c of clients(); track c._id) {
            <option [value]="c._id">{{ c.fullName }}</option>
          }
        </select>
      </label>

      <label class="field">
        <span>Título</span>
        <input
          type="text"
          [ngModel]="title()"
          (ngModelChange)="title.set($event)"
          placeholder="Revisión semanal · Semana 8"
        />
      </label>

      <label class="field">
        <span>Fecha y hora</span>
        <input
          type="datetime-local"
          [ngModel]="dateLocal()"
          (ngModelChange)="dateLocal.set($event)"
        />
      </label>

      <div class="status-toggle" role="group" aria-label="Estado">
        @for (item of statuses; track item.key) {
          <button
            type="button"
            class="status-btn"
            [class.is-on]="status() === item.key"
            [class.is-done]="item.key === 'done'"
            [class.is-canceled]="item.key === 'canceled'"
            (click)="setStatus(item.key)">
            {{ item.label }}
          </button>
        }
      </div>

      <label class="field">
        <span>Nota para el cliente</span>
        <textarea
          rows="4"
          [ngModel]="note()"
          (ngModelChange)="note.set($event)"
          placeholder="Sube fotos y medidas 24h antes…"></textarea>
      </label>
    </div>

    @if (saveError()) {
      <p class="board__error">{{ saveError() }}</p>
    }

    <footer class="board__foot">
      @if (isEdit) {
        <button
          type="button"
          class="danger-btn"
          (click)="remove()"
          [disabled]="saving() || deleting()">
          {{ deleting() ? 'Eliminando…' : 'Eliminar' }}
        </button>
      }
      <div class="board__foot-right">
        <button
          type="button"
          class="ghost-btn"
          (click)="close()"
          [disabled]="saving() || deleting()">
          Cancelar
        </button>
        <button
          type="button"
          class="save-btn"
          (click)="save()"
          [disabled]="saving() || deleting()">
          {{ saving() ? 'Guardando…' : isEdit ? 'Guardar cambios' : 'Programar' }}
        </button>
      </div>
    </footer>
  </div>
</div>
