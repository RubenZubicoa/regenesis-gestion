<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="measurement-dialog-title">
  <button type="button" class="sheet__backdrop" (click)="close()" aria-label="Cerrar"></button>

  <div class="board">
    <div class="board__glow" aria-hidden="true"></div>

    <header class="board__head">
      <div>
        <p class="eyebrow">Maestro de medidas</p>
        <h2 id="measurement-dialog-title">
          {{ isEdit ? 'Editar medida' : 'Nueva medida' }}
        </h2>
      </div>
      <button type="button" class="board__close" (click)="close()" aria-label="Cerrar">×</button>
    </header>

    <div class="board__body">
      <app-measurement-master-form
        [draft]="draft()"
        (draftChange)="draft.set($event)"
        [syncKeyFromLabel]="!isEdit"
      />
    </div>

    @if (saveError()) {
      <p class="board__error">{{ saveError() }}</p>
    }

    <footer class="board__foot">
      @if (isEdit) {
        <button
          type="button"
          class="danger-btn"
          (click)="remove()"
          [disabled]="saving() || deleting()">
          {{ deleting() ? 'Eliminando…' : 'Eliminar' }}
        </button>
      }
      <div class="board__foot-right">
        <button
          type="button"
          class="ghost-btn"
          (click)="close()"
          [disabled]="saving() || deleting()">
          Cancelar
        </button>
        <button
          type="button"
          class="save-btn"
          (click)="save()"
          [disabled]="saving() || deleting()">
          {{ saving() ? 'Guardando…' : isEdit ? 'Guardar cambios' : 'Crear medida' }}
        </button>
      </div>
    </footer>
  </div>
</div>
