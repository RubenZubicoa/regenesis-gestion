<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="password-dialog-title">
  <button type="button" class="sheet__backdrop" (click)="close()" aria-label="Cerrar"></button>

  <div class="board">
    <div class="board__glow" aria-hidden="true"></div>

    <header class="board__head">
      <div>
        <p class="eyebrow">Acceso del cliente</p>
        <h2 id="password-dialog-title">Cambiar contraseña</h2>
      </div>
      <button type="button" class="board__close" (click)="close()" aria-label="Cerrar">×</button>
    </header>

    @if (clientName()) {
      <p class="phase-note">{{ clientName() }}</p>
    }

    <form class="board__form" (submit)="$event.preventDefault(); save()">
      <div class="board__body">
        <label class="field field--full">
          <span>Nueva contraseña</span>
          <input
            type="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            autocomplete="new-password"
            placeholder="Mínimo 6 caracteres"
          />
        </label>

        <label class="field field--full">
          <span>Repetir contraseña</span>
          <input
            type="password"
            [ngModel]="confirm()"
            (ngModelChange)="confirm.set($event)"
            name="confirm"
            autocomplete="new-password"
            placeholder="Vuelve a escribirla"
          />
        </label>
      </div>

      @if (saveError()) {
        <p class="board__error">{{ saveError() }}</p>
      }

      <footer class="board__foot">
        <div class="board__foot-right">
          <button
            type="button"
            class="ghost-btn"
            (click)="close()"
            [disabled]="saving()">
            Cancelar
          </button>
          <button type="submit" class="save-btn" [disabled]="saving()">
            {{ saving() ? 'Guardando…' : 'Actualizar contraseña' }}
          </button>
        </div>
      </footer>
    </form>
  </div>
</div>
