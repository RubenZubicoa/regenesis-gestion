<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="steps-dialog-title">
  <button type="button" class="sheet__backdrop" (click)="close()" aria-label="Cerrar"></button>

  <div class="board">
    <div class="board__glow" aria-hidden="true"></div>

    <header class="board__head">
      <div>
        <p class="eyebrow">Actividad diaria</p>
        <h2 id="steps-dialog-title">{{ isEdit ? 'Editar pasos' : 'Registrar pasos' }}</h2>
      </div>
      <button type="button" class="board__close" (click)="close()" aria-label="Cerrar">×</button>
    </header>

    @if (clientName()) {
      <p class="client-note">{{ clientName() }}</p>
    }

    <form class="board__form" (submit)="$event.preventDefault(); save()">
      <div class="board__body">
        <div class="day-picks" role="listbox" aria-label="Últimos 15 días">
          @for (day of days(); track day.date) {
            <button
              type="button"
              class="day-pick"
              role="option"
              [class.is-active]="date() === day.date"
              [attr.aria-selected]="date() === day.date"
              (click)="applyDate(day.date)">
              <span>{{ formatDayLabel(day.date) }}</span>
              <strong>{{ day.steps > 0 ? day.steps : '—' }}</strong>
            </button>
          }
        </div>

        <label class="field">
          <span>Día</span>
          <input
            type="date"
            [ngModel]="date()"
            (ngModelChange)="applyDate($event)"
            name="date"
          />
          <small>Elige un día de la lista o la fecha para introducir o editar sus pasos.</small>
        </label>

        <label class="field">
          <span>Pasos</span>
          <input
            type="number"
            min="0"
            step="1"
            inputmode="numeric"
            [ngModel]="steps()"
            (ngModelChange)="setSteps($event)"
            name="steps"
            placeholder="10000"
          />
        </label>
      </div>

      @if (saveError()) {
        <p class="board__error">{{ saveError() }}</p>
      }

      <footer class="board__foot">
        <div class="board__foot-right">
          <button type="button" class="ghost-btn" (click)="close()" [disabled]="saving()">
            Cancelar
          </button>
          <button type="submit" class="save-btn" [disabled]="saving()">
            {{ saving() ? 'Guardando…' : isEdit ? 'Guardar cambios' : 'Registrar pasos' }}
          </button>
        </div>
      </footer>
    </form>
  </div>
</div>
