<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="weight-dialog-title">
  <button type="button" class="sheet__backdrop" (click)="close()" aria-label="Cerrar"></button>

  <div class="board">
    <div class="board__glow" aria-hidden="true"></div>

    <header class="board__head">
      <div>
        <p class="eyebrow">Seguimiento corporal</p>
        <h2 id="weight-dialog-title">{{ isEdit ? 'Editar peso' : 'Registrar peso' }}</h2>
      </div>
      <button type="button" class="board__close" (click)="close()" aria-label="Cerrar">×</button>
    </header>

    @if (clientName()) {
      <p class="client-note">{{ clientName() }}</p>
    }

    <form class="board__form" (submit)="$event.preventDefault(); save()">
      <div class="board__body">
        <label class="field">
          <span>Fecha</span>
          <input
            type="date"
            [ngModel]="date()"
            (ngModelChange)="date.set($event)"
            name="date"
          />
          <small>Si la fecha ya existe, se actualiza ese registro.</small>
        </label>

        <label class="field">
          <span>Peso corporal (kg)</span>
          <input
            type="number"
            min="0"
            step="0.1"
            inputmode="decimal"
            [ngModel]="value()"
            (ngModelChange)="setValue($event)"
            name="value"
            placeholder="74.2"
          />
        </label>
      </div>

      @if (saveError()) {
        <p class="board__error">{{ saveError() }}</p>
      }

      <footer class="board__foot">
        <div class="board__foot-right">
          <button type="button" class="ghost-btn" (click)="close()" [disabled]="saving()">
            Cancelar
          </button>
          <button type="submit" class="save-btn" [disabled]="saving()">
            {{ saving() ? 'Guardando…' : isEdit ? 'Guardar cambios' : 'Registrar peso' }}
          </button>
        </div>
      </footer>
    </form>
  </div>
</div>
