<div class="line-chart">
  <svg
    class="line-chart__svg"
    [attr.viewBox]="'0 0 ' + chart().width + ' ' + chart().height"
    role="img"
    [attr.aria-label]="ariaLabel()">
    <defs>
      <linearGradient [attr.id]="gradientId" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4c8df6" stop-opacity="0.35" />
        <stop offset="100%" stop-color="#4c8df6" stop-opacity="0.02" />
      </linearGradient>
    </defs>

    @for (tick of chart().yTicks; track $index) {
      <line
        [attr.x1]="44"
        [attr.x2]="chart().width - 20"
        [attr.y1]="tick.y"
        [attr.y2]="tick.y"
        class="line-chart__grid"
      />
      <text [attr.x]="38" [attr.y]="tick.y + 4" class="line-chart__ylabel">
        {{ tick.label }}
      </text>
    }

    @if (chart().targetY != null) {
      <line
        [attr.x1]="44"
        [attr.x2]="chart().width - 20"
        [attr.y1]="chart().targetY"
        [attr.y2]="chart().targetY"
        class="line-chart__target"
      />
      @if (targetLabel()) {
        <text
          [attr.x]="chart().width - 18"
          [attr.y]="(chart().targetY ?? 0) - 6"
          class="line-chart__target-label">
          {{ targetLabel() }}
        </text>
      }
    }

    @if (chart().areaPath) {
      <path
        [attr.d]="chart().areaPath"
        class="line-chart__area"
        [style.fill]="'url(#' + gradientId + ')'"
      />
    }
    @if (chart().linePath) {
      <path [attr.d]="chart().linePath" class="line-chart__line" />
    }

    @for (point of chart().points; track $index) {
      <circle [attr.cx]="point.x" [attr.cy]="point.y" r="5" class="line-chart__dot" />
      <circle [attr.cx]="point.x" [attr.cy]="point.y" r="9" class="line-chart__dot-halo" />
      <text [attr.x]="point.x" [attr.y]="point.y - 12" class="line-chart__value">
        {{ point.value }}
      </text>
      @if (point.showLabel) {
        <text [attr.x]="point.x" [attr.y]="chart().height - 10" class="line-chart__xlabel">
          {{ formatLabel(point.label) }}
        </text>
      }
    }
  </svg>
  <div class="line-chart__footer">
    <ng-content />
  </div>
</div>
