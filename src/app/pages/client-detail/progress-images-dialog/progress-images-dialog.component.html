<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="progress-images-dialog-title">
  <button type="button" class="sheet__backdrop" (click)="close()" aria-label="Cerrar"></button>

  <div class="board">
    <div class="board__glow" aria-hidden="true"></div>

    <header class="board__head">
      <div>
        <p class="eyebrow">Seguimiento corporal</p>
        <h2 id="progress-images-dialog-title">Agregar foto</h2>
      </div>
      <button type="button" class="board__close" (click)="close()" aria-label="Cerrar">×</button>
    </header>

    @if (clientName()) {
      <p class="client-note">{{ clientName() }}</p>
    }

    <form class="board__form" (submit)="$event.preventDefault(); save()">
      <div class="board__body">
        @if (preview()) {
          <div class="preview">
            <img [src]="preview()" [alt]="pose()" />
          </div>
        }

        <label class="field">
          <span>Fecha</span>
          <input
            type="date"
            [ngModel]="date()"
            (ngModelChange)="date.set($event)"
            name="date"
          />
          <small>Fecha en la que se tomó la foto.</small>
        </label>

        <div class="field">
          <span>Tipo de imagen</span>
          <div class="pose-picks" role="group" aria-label="Tipo de imagen">
            @for (item of poses; track item) {
              <button
                type="button"
                class="pose-pick"
                [class.is-on]="pose() === item"
                (click)="setPose(item)">
                {{ item }}
              </button>
            }
          </div>
        </div>

        <div class="field">
          <span>Imagen</span>
          <div class="file-row">
            <input
              id="progress-image-file"
              class="file-input"
              type="file"
              accept="image/*"
              (change)="onImageSelected($event)"
            />
            <label class="file-btn" for="progress-image-file">Elegir archivo</label>
            <span class="file-name">{{ fileName() || 'Sin imagen' }}</span>
          </div>
          <small>Formatos de imagen habituales (JPG, PNG, WEBP).</small>
        </div>
      </div>

      @if (saveError()) {
        <p class="board__error">{{ saveError() }}</p>
      }

      <footer class="board__foot">
        <div class="board__foot-right">
          <button type="button" class="ghost-btn" (click)="close()" [disabled]="saving()">
            Cancelar
          </button>
          <button type="submit" class="save-btn" [disabled]="saving()">
            {{ saving() ? 'Guardando…' : 'Añadir foto' }}
          </button>
        </div>
      </footer>
    </form>
  </div>
</div>
