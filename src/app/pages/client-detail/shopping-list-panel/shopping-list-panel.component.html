<div class="panel-block">
  <div class="panel-block__head">
    <h2>Lista de la compra</h2>
    <button
      type="button"
      class="action-btn"
      (click)="save()"
      [disabled]="busy() || !file()">
      {{ saving() ? 'Guardando…' : 'Guardar lista' }}
    </button>
  </div>

  <div class="attach">
    <span>Archivo</span>
    <div class="file-row">
      <input
        id="shopping-list-file"
        class="file-input"
        type="file"
        (change)="onFileSelected($event)"
      />
      <label class="file-btn" for="shopping-list-file">
        {{ file() || currentUrl() ? 'Cambiar archivo' : 'Adjuntar archivo' }}
      </label>
      <span class="file-name">{{ fileLabel() }}</span>
      <div class="file-actions">
        @if (currentUrl() && !file()) {
          <a
            class="file-open"
            [href]="currentUrl()"
            target="_blank"
            rel="noopener noreferrer">
            Abrir
          </a>
          <button
            type="button"
            class="file-remove"
            (click)="remove()"
            [disabled]="busy()">
            {{ deleting() ? 'Eliminando…' : 'Eliminar' }}
          </button>
        }
        @if (file()) {
          <button type="button" class="file-remove" (click)="clearPending()" [disabled]="busy()">
            Quitar
          </button>
        }
      </div>
    </div>
  </div>

  @if (status()) {
    <p class="state state--ok">{{ status() }}</p>
  }
  @if (error()) {
    <p class="state state--error">{{ error() }}</p>
  }
</div>
